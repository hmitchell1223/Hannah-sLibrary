<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'IM Fell English', serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5dc;
      color: #fff1ca;
    }

    header, footer {
      background-color: #f5f5dc;
      color: #916c47;
      text-align: center;
      padding: 20px;
    }

    nav {
      background-color: #84592c;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid #ccc;
    }

    nav a {
      color: #f3cfa1;
      padding: 14px 20px;
      text-decoration: none;
      font-style: italic;
    }

    nav a:hover {
      background-color: #916c47;
      color: #f3cfa1;
    }

    main {
      max-width: 800px;
      margin: 0 auto 40px auto;
      padding: 20px;
      background-color: #a4b282;
      border-radius: 10px;
    }

    h2, p {
      font-style: italic;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 10px;
      color: #fff1ca;
    }

    input, textarea {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 5px;
      font-family: 'IM Fell English', serif;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      background-color: #84592c;
      color: #f3cfa1;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-style: italic;
    }

    button:hover {
      background-color: #916c47;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hannah's Library</h1>
    <p>Thanks for visiting my website! You should check out some of my content :)</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="posts.html">Posts</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <h2>Contact Me</h2>
    <p>Want to send me a message? Let's chat!</p>
    <form action="mailto:hannahcamille.2003@gmail.com" method="post" enctype="text/plain">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
